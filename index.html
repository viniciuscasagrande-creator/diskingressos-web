<!doctype html>
<html lang="pt-BR" data-ui-framework="limitless" data-disk-master-visual="2026-09-17-limitless-v7-pedidos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>DiskIngressos • Gestão de Eventos, Financeiro & Contabilidade</title>
    <style>html,body,#root{height:100%;margin:0}</style>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('disk-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || ((!stored || stored === 'system') && prefersDark) ? 'dark' : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.setAttribute('data-theme', resolved);
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', resolved === 'dark' ? '#0B0F19' : '#F8FAFC');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
